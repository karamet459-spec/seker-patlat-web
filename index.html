.vl{color:var(--sub);text-align:center}

var task={type:"any",n:1,fruit:0},tc=0;
function setTask(l){var k=l%4;
 if(k==1)task={type:"fruit",fruit:l%ncol,n:Math.min(23,7+Math.floor(l*0.55))};
 else if(k==2)task={type:"combo",n:Math.min(5,2+Math.floor(l/8))};
 else if(k==3)task={type:"bomb",n:Math.min(5,1+Math.floor(l/25))};
 else task={type:"any",n:Math.min(100,30+Math.floor(l*2.5))};
 tc=0;taskUI()}
function taskOK(){return tc>=task.n}
function taskUI(){
 var t=task.type=="fruit"?tx("tFruit",T[task.fruit],task.n):task.type=="combo"?tx("tCombo",task.n):task.type=="bomb"?tx("tBomb",task.n):tx("tAny",task.n);
 var cur=Math.min(tc,task.n);
 $("task").textContent=tx("task")+t+" ("+cur+"/"+task.n+")"+(taskOK()?" ✅":"");
}

function fmt(t){var m=Math.floor(t/60),r=t%60;return m+":"+(r<10?"0":"")+r}
function timeUI(){$("tm").textContent=fmt(tsec)}
setInterval(function(){if($("game").classList.contains("on")&&!over&&!document.hidden&&!$("ov").classList.contains("on")&&!adBusy){tsec++;timeUI()}},1000);
livesUI();setInterval(livesUI,1000);setBg(0);

function tn(){var m=tq.shift();if(!m){tqb=false;return}tqb=true;var e=$("toast");e.textContent=m;e.classList.add("on");setTimeout(function(){e.classList.remove("on");setTimeout(tn,250)},2000)}
function giftLabel(){$("bGift").textContent=tx("gift")+(prog.gift==today()?" ✓":"")}

 if(!a.length)h='<div class="vl">'+tx("noScores")+'</div>';

function drawCard(){
 var c=document.createElement("canvas");c.width=c.height=800;var x=c.getContext("2d");
 var g2=x.createLinearGradient(0,0,800,800);g2.addColorStop(0,"#ff69b4");g2.addColorStop(1,"#9a5aeb");x.fillStyle=g2;x.fillRect(0,0,800,800);
 x.fillStyle="rgba(255,255,255,.92)";x.beginPath();if(x.roundRect)x.roundRect(60,60,680,680,40);else x.rect(60,60,680,680);x.fill();
 x.textAlign="center";x.fillStyle="#3b1d4a";x.font="bold 64px 'Trebuchet MS',sans-serif";x.fillText("🍬 "+tx("title"),400,170);
 var b=(prog.scores&&prog.scores[0])||{s:0,l:1};
 x.font="36px 'Trebuchet MS',sans-serif";x.fillStyle="#7a5a86";x.fillText(tx("best"),400,300);
 x.font="bold 160px 'Trebuchet MS',sans-serif";x.fillStyle="#e63e8a";x.fillText(String(b.s),400,460);
 x.font="44px 'Trebuchet MS',sans-serif";x.fillStyle="#3b1d4a";x.fillText(tx("scRow",b.l)+"  ·  ⭐ "+totalStars()+"/"+TOTAL*3,400,560);
 x.font="36px 'Trebuchet MS',sans-serif";x.fillStyle="#7a5a86";x.fillText(tx("tryIt"),400,660);x.font="28px 'Trebuchet MS',sans-serif";x.fillText(tx("credit"),400,710);
 return c}

 if(!adReady||!ADS||adBusy)return;
 if(prog.adDay!=today()){prog.adDay=today();prog.adCnt=0}

 var A=getAdMob();adBusy=true;musStop();
 try{var r;if(ADS.reward){await A.prepareRewardVideoAd({adId:ADS.reward,isTesting:!!ADS.testing});r=await A.showRewardVideoAd()}else{await A.prepareRewardInterstitialAd({adId:ADS.rewardInt,isTesting:!!ADS.testing});r=await A.showRewardInterstitialAd()}
  if(r){prog.adCnt++;prog.lives=Math.min(MAXL,prog.lives+3);save();livesUI();sfx("coin");toast(tx("adOk"))}}
 catch(e){toast(tx("adFail")+" ["+String((e&&(e.message||e.code))||e).slice(0,80)+"]")}
 adBusy=false;musStart();
}
function getAdMob(){try{if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){return Capacitor.registerPlugin?Capacitor.registerPlugin("AdMob"):(Capacitor.Plugins&&Capacitor.Plugins.AdMob)}}catch(e){}return null}
function adSt(k){window.adStatus=k;var e=$("adSt");if(e)e.textContent="Ads: "+k}
(function(){
 if(!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())){adSt("web (no ads here)");return}
 var A=getAdMob();if(!A){adSt("plugin missing");return}
 adSt("loading config");
 fetch("ads-config.json").then(function(r){return r.json()}).then(function(c){
  ADS=c;adSt("initializing");
  return A.initialize({initializeForTesting:!!c.testing}).then(function(){
   return A.requestConsentInfo().then(function(i){if(i&&i.isConsentFormAvailable&&i.status=="REQUIRED")return A.showConsentForm()}).catch(function(){})
  }).then(function(){adReady=true;adLabel();showBn();adSt("ready")})
 }).catch(function(e){adSt("error: "+((e&&e.message)||e))})
})();
